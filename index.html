<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription Étudiants</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="titre-formulaire">
        <header class="card__header">
          <p class="eyebrow">Université Formulaire</p>
          <h1 id="titre-formulaire">Formulaire d'inscription étudiant</h1>
          <p class="subtitle">
            Remplissez vos informations pour finaliser votre inscription.
          </p>
        </header>

        <form class="form" action="#" method="post">
          <div class="field-group">
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" placeholder="Ex: Dupont" required />
          </div>

          <div class="field-group">
            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" name="prenom" placeholder="Ex: Marie" required />
          </div>

          <div class="field-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Ex: marie.dupont@email.com" required />
          </div>

          <div class="field-group">
            <label for="telephone">Téléphone</label>
            <input type="tel" id="telephone" name="telephone" placeholder="Ex: 06 12 34 56 78" required />
          </div>

          <div class="field-group">
            <label for="date-naissance">Date de naissance</label>
            <input type="date" id="date-naissance" name="date-naissance" required />
          </div>

          <div class="field-group">
            <label for="filiere">Filière</label>
            <select id="filiere" name="filiere" required>
              <option value="" selected disabled>Choisir une filière</option>
              <option value="informatique">Informatique</option>
              <option value="gestion">Gestion</option>
              <option value="droit">Droit</option>
              <option value="medecine">Médecine</option>
              <option value="ingenierie">Ingénierie</option>
            </select>
          </div>

          <div class="field-group field-group--full">
            <label for="adresse">Adresse</label>
            <textarea
              id="adresse"
              name="adresse"
              rows="3"
              placeholder="Ex: 12 rue de l'Université, 75000 Paris"
              required
            ></textarea>
          </div>

          <div class="checkbox-group field-group--full">
            <input type="checkbox" id="conditions" name="conditions" required />
            <label for="conditions">
              J'accepte les conditions générales et l'utilisation de mes données dans le cadre
              de l'inscription.
            </label>
          </div>

          <button type="submit" class="btn-submit">Valider l'inscription</button>
        </form>
      </section>
    </main>
  </body>
</html>
